<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Makanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Daftar Menu Favorit</h1>
        <div id="daftar-item" class="card-container">
            <!-- Kartu akan dirender otomatis oleh JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('daftar-item');

            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    renderItems(data.items);
                })
                .catch(error => {
                    console.error('Terjadi kesalahan:', error);
                    container.innerHTML = '<p style="color: white; text-align: center;">Gagal memuat data menu.</p>';
                });

            function renderItems(items) {
                container.innerHTML = ''; 
                
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    // Menambahkan tag <img> untuk memanggil gambar
                    card.innerHTML = `
                        <img src="${item.gambar}" alt="${item.nama}" class="card-img">
                        <div class="card-content">
                            <h3>${item.nama}</h3>
                            <p>${item.deskripsi}</p>
                            <span class="kategori">${item.kategori}</span>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
